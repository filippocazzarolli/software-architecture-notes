<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">Salvare il fatto e il lavoro da consegnare</title><desc id="desc">La transazione salva todo e messaggio; il worker pubblica dopo il commit e Report deduplica.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker></defs><rect width="1040" height="520" rx="20" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
<text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">1.5 / OUTBOX</text><text x="36" y="88" font-size="29" font-weight="700">Salvare il fatto e il lavoro da consegnare</text>
<rect x="36" y="145" width="300" height="270" rx="14" fill="#eaf0fa" stroke="#a9bddc"/><text x="56" y="186" font-size="21" font-weight="700">Una transazione</text>
<text x="56" y="233" font-size="17" fill="#52647a">UPDATE todo</text>
<text x="56" y="264" font-size="17" fill="#52647a">INSERT outbox</text>
<text x="56" y="295" font-size="17" fill="#52647a">Commit di entrambi</text>
<text x="56" y="326" font-size="17" fill="#52647a">oppure rollback</text>
<path d="M339 282 H361" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="370" y="145" width="300" height="270" rx="14" fill="#e8f5f1" stroke="#91c9bd"/><text x="390" y="186" font-size="21" font-weight="700">Worker → broker</text>
<text x="390" y="233" font-size="17" fill="#52647a">Legge dopo il commit</text>
<text x="390" y="264" font-size="17" fill="#52647a">Pubblica e attende conferma</text>
<text x="390" y="295" font-size="17" fill="#52647a">Poi marca come pubblicato</text>
<text x="390" y="326" font-size="17" fill="#52647a">Può ripetere la consegna</text>
<path d="M673 282 H695" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="704" y="145" width="300" height="270" rx="14" fill="#fff4e6" stroke="#dcbf92"/><text x="724" y="186" font-size="21" font-weight="700">Report</text>
<text x="724" y="233" font-size="17" fill="#52647a">Deduplica per eventId</text>
<text x="724" y="264" font-size="17" fill="#52647a">Aggiorna il conteggio</text>
<text x="724" y="295" font-size="17" fill="#52647a">nella stessa transazione</text>
<text x="724" y="326" font-size="17" fill="#52647a">Poi conferma la ricezione</text>
<text x="520" y="462" text-anchor="middle" font-size="18" fill="#52647a">Il commit conserva l’intenzione. Il worker rende possibile il recupero.</text>
<text x="520" y="490" text-anchor="middle" font-size="16" fill="#52647a">Una consegna ripetuta deve lasciare invariato il risultato del report.</text>
</g></svg>
