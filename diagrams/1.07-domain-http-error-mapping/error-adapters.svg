<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">Una regola, risposte adatte al canale</title><desc id="desc">Il dominio esprime TodoLimitExceeded. Il caso d’uso propaga il rifiuto. Gli adattatori decidono come comunicarlo.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker></defs><rect width="1040" height="520" rx="20" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
<text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">1.7 / ERRORI E TRASPORTO</text><text x="36" y="88" font-size="29" font-weight="700">Una regola, risposte adatte al canale</text>
<rect x="36" y="145" width="300" height="270" rx="14" fill="#eaf0fa" stroke="#a9bddc"/><text x="56" y="186" font-size="21" font-weight="700">Dominio</text>
<text x="56" y="233" font-size="17" fill="#52647a">Tre todo già attivi</text>
<text x="56" y="264" font-size="17" fill="#52647a">Nuova attivazione rifiutata</text>
<text x="56" y="295" font-size="17" fill="#52647a">TodoLimitExceeded</text>
<text x="56" y="326" font-size="17" fill="#52647a">Nessun tipo HTTP</text>
<path d="M339 282 H361" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="370" y="145" width="300" height="270" rx="14" fill="#e8f5f1" stroke="#91c9bd"/><text x="390" y="186" font-size="21" font-weight="700">Caso d’uso</text>
<text x="390" y="233" font-size="17" fill="#52647a">Legge dati autorevoli</text>
<text x="390" y="264" font-size="17" fill="#52647a">Verifica la regola</text>
<text x="390" y="295" font-size="17" fill="#52647a">Non conferma la modifica</text>
<text x="390" y="326" font-size="17" fill="#52647a">Propaga il rifiuto</text>
<path d="M673 282 H695" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="704" y="145" width="300" height="270" rx="14" fill="#fff4e6" stroke="#dcbf92"/><text x="724" y="186" font-size="21" font-weight="700">Adattatori</text>
<text x="724" y="233" font-size="17" fill="#52647a">HTTP → 409 e codice API</text>
<text x="724" y="264" font-size="17" fill="#52647a">CLI → testo e codice uscita</text>
<text x="724" y="295" font-size="17" fill="#52647a">Coda → esito registrato</text>
<text x="724" y="326" font-size="17" fill="#52647a">Politica esplicita sui retry</text>
<text x="520" y="462" text-anchor="middle" font-size="18" fill="#52647a">Le frecce mostrano il percorso del rifiuto verso il chiamante.</text>
<text x="520" y="490" text-anchor="middle" font-size="16" fill="#52647a">Le dipendenze dal framework rimangono negli adattatori.</text>
</g></svg>
