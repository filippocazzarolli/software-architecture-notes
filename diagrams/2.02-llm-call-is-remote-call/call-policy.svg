<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Una dipendenza lenta e a pagamento</title>
  <desc id="desc">Tre riquadri da sinistra a destra: il confine HTTP, con il limite di caratteri sugli appunti, il budget di tempo dell'interfaccia e la cache per richieste identiche; la paratia, con la concorrenza massima dedicata e l'interruttore dopo una serie di fallimenti; l'adapter, con il timeout pari al tempo residuo del budget, un solo tentativo ripetuto e l'errore tecnico SuggestionUnavailable. Una freccia di ritorno mostra la via d'uscita: lista vuota e creazione manuale. Una fascia in basso descrive il fornitore.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52647a" stroke-width="1.5"/></marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="520" rx="20" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
    <text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">2.2 / CHIAMATA REMOTA</text>
    <text x="36" y="85" font-size="30" font-weight="700">Una dipendenza lenta e a pagamento</text>
    <text x="36" y="116" font-size="18" fill="#52647a">La politica si decide prima della chiamata, non dopo la prima fattura.</text>

    <rect x="32" y="146" width="300" height="190" rx="12" fill="#eaf0fa" stroke="#a9bddc"/>
    <rect x="370" y="146" width="300" height="190" rx="12" fill="#fff" stroke="#bbc9d8"/>
    <rect x="708" y="146" width="300" height="190" rx="12" fill="#e8f5f1" stroke="#91c9bd"/>

    <text x="52" y="176" font-size="14" font-weight="700" fill="#355b91">01</text>
    <text x="52" y="206" font-size="21" font-weight="700">Confine HTTP</text>
    <text x="52" y="240" font-size="15" fill="#52647a">Limite di caratteri sugli appunti</text>
    <text x="52" y="262" font-size="15" fill="#52647a">Budget di tempo dell'interfaccia</text>
    <text x="52" y="284" font-size="15" fill="#52647a">Cache per richieste identiche</text>

    <text x="390" y="176" font-size="14" font-weight="700" fill="#52647a">02</text>
    <text x="390" y="206" font-size="21" font-weight="700">Paratia</text>
    <text x="390" y="240" font-size="15" fill="#52647a">Concorrenza massima dedicata</text>
    <text x="390" y="262" font-size="15" fill="#52647a">Interruttore dopo N fallimenti</text>
    <text x="390" y="284" font-size="15" fill="#52647a">Oltre il limite: fallisce subito</text>

    <text x="728" y="176" font-size="14" font-weight="700" fill="#14766d">03</text>
    <text x="728" y="206" font-size="21" font-weight="700">Adapter</text>
    <text x="728" y="240" font-size="15" fill="#52647a">Timeout = tempo residuo del budget</text>
    <text x="728" y="262" font-size="15" fill="#52647a">Un tentativo per 429, 5xx, timeout</text>
    <text x="728" y="284" font-size="15" fill="#52647a">Altrimenti SuggestionUnavailable</text>

    <path d="M332 241 L366 241" fill="none" stroke="#52647a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M670 241 L704 241" fill="none" stroke="#52647a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M858 336 L858 358 L182 358 L182 340" fill="none" stroke="#14766d" stroke-width="1.5" marker-end="url(#feedback)"/>
    <text x="520" y="352" font-size="14" text-anchor="middle" fill="#14766d">Via d'uscita: lista vuota, la creazione manuale continua a funzionare</text>

    <rect x="32" y="384" width="976" height="66" rx="12" fill="#fff" stroke="#bbc9d8" stroke-dasharray="6 4"/>
    <text x="52" y="411" font-size="15" font-weight="700">Il fornitore</text>
    <text x="52" y="434" font-size="15" fill="#52647a">Risponde in secondi, costa per token, non ripete la stessa risposta. I worker seguono il suo limite di richieste, non la CPU.</text>

    <text x="36" y="496" font-size="15" fill="#52647a">Latenza ed errori si osservano come per ogni chiamata di rete; in più la spesa per chiamata e per giorno.</text>
  </g>
</svg>
