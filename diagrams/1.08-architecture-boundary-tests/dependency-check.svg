<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">Rendere verificabili le dipendenze</title><desc id="desc">I file sorgente vengono risolti in un grafo di import, confrontato con regole esplicite nella CI.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker></defs><rect width="1040" height="520" rx="20" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
<text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">1.8 / VERIFICHE ARCHITETTURALI</text><text x="36" y="88" font-size="29" font-weight="700">Rendere verificabili le dipendenze</text>
<rect x="36" y="145" width="300" height="270" rx="14" fill="#eaf0fa" stroke="#a9bddc"/><text x="56" y="186" font-size="21" font-weight="700">Sorgenti TypeScript</text>
<text x="56" y="233" font-size="17" fill="#52647a">Import e riesportazioni</text>
<text x="56" y="264" font-size="17" fill="#52647a">Alias del progetto</text>
<text x="56" y="295" font-size="17" fill="#52647a">Dipendenze di tipo</text>
<text x="56" y="326" font-size="17" fill="#52647a">Percorsi da risolvere</text>
<path d="M339 282 H361" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="370" y="145" width="300" height="270" rx="14" fill="#e8f5f1" stroke="#91c9bd"/><text x="390" y="186" font-size="21" font-weight="700">Grafo e regole</text>
<text x="390" y="233" font-size="17" fill="#52647a">Dominio indipendente</text>
<text x="390" y="264" font-size="17" fill="#52647a">Casi d’uso senza adattatori</text>
<text x="390" y="295" font-size="17" fill="#52647a">Accessi da API pubbliche</text>
<text x="390" y="326" font-size="17" fill="#52647a">Import risolvibili e cicli</text>
<path d="M673 282 H695" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="704" y="145" width="300" height="270" rx="14" fill="#fff4e6" stroke="#dcbf92"/><text x="724" y="186" font-size="21" font-weight="700">Riscontro in CI</text>
<text x="724" y="233" font-size="17" fill="#52647a">File di origine</text>
<text x="724" y="264" font-size="17" fill="#52647a">Dipendenza vietata</text>
<text x="724" y="295" font-size="17" fill="#52647a">Nome della regola</text>
<text x="724" y="326" font-size="17" fill="#52647a">Errore che blocca il merge</text>
<text x="520" y="462" text-anchor="middle" font-size="18" fill="#52647a">Fixture valide e non valide verificano il controllo stesso.</text>
<text x="520" y="490" text-anchor="middle" font-size="16" fill="#52647a">Regole di business, concorrenza e accessi ai dati richiedono altre verifiche.</text>
</g></svg>
