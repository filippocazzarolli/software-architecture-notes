<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
  <title id="title">Stesso deployment, confini diversi</title>
  <desc id="desc">A sinistra Account e Todo accedono alle tabelle di entrambi. A destra Todo usa l'interfaccia pubblica di Account e ogni modulo accede solo ai propri dati. Entrambe le soluzioni hanno un deployment e un database.</desc>
  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b34b3b" stroke-width="1.5"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="550" rx="20" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
    <text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">1.2 / CONFINI</text>
    <text x="36" y="85" font-size="30" font-weight="700">Stesso deployment, confini diversi</text>
    <rect x="28" y="118" width="476" height="342" rx="16" fill="#fff" stroke="#d8e0e9"/>
    <rect x="536" y="118" width="476" height="342" rx="16" fill="#fff" stroke="#d8e0e9"/>
    <text x="52" y="155" font-size="22" font-weight="700">Monolite accoppiato</text>
    <text x="560" y="155" font-size="22" font-weight="700">Monolite modulare</text>
    <text x="52" y="182" font-size="16" fill="#52647a">Dettagli interni condivisi</text>
    <text x="560" y="182" font-size="16" fill="#52647a">Dipendenze esplicite</text>
    <rect x="52" y="210" width="168" height="72" rx="10" fill="#eaf0fa" stroke="#a9bddc"/>
    <rect x="312" y="210" width="168" height="72" rx="10" fill="#e8f5f1" stroke="#91c9bd"/>
    <text x="136" y="252" text-anchor="middle" font-size="21" font-weight="700">Account</text>
    <text x="396" y="252" text-anchor="middle" font-size="21" font-weight="700">Todo</text>
    <g fill="none" stroke="#b34b3b" stroke-width="2.5" marker-end="url(#red)">
      <path d="M136 282 V348"/>
      <path d="M396 282 V348"/>
      <path d="M168 282 L365 348" stroke-dasharray="6 5"/>
      <path d="M364 282 L167 348" stroke-dasharray="6 5"/>
    </g>
    <rect x="52" y="354" width="428" height="80" rx="10" fill="#f6f8fb" stroke="#d8e0e9"/>
    <text x="136" y="385" text-anchor="middle" font-size="18">Utenti</text>
    <text x="396" y="385" text-anchor="middle" font-size="18">Todo</text>
    <text x="266" y="415" text-anchor="middle" font-size="15" fill="#52647a">Un database · accessi incrociati</text>
    <rect x="560" y="210" width="168" height="72" rx="10" fill="#eaf0fa" stroke="#a9bddc"/>
    <rect x="820" y="210" width="168" height="72" rx="10" fill="#e8f5f1" stroke="#91c9bd"/>
    <text x="644" y="240" text-anchor="middle" font-size="21" font-weight="700">Account</text>
    <text x="644" y="266" text-anchor="middle" font-size="15" fill="#355b91">API pubblica</text>
    <text x="904" y="252" text-anchor="middle" font-size="21" font-weight="700">Todo</text>
    <g fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#teal)">
      <path d="M820 247 H736"/>
      <path d="M644 282 V348"/>
      <path d="M904 282 V348"/>
    </g>
    <rect x="560" y="354" width="428" height="80" rx="10" fill="#f6f8fb" stroke="#d8e0e9"/>
    <path d="M774 365 V392" stroke="#bbc9d8" stroke-dasharray="4 4"/>
    <text x="662" y="385" text-anchor="middle" font-size="18">Dati Account</text>
    <text x="886" y="385" text-anchor="middle" font-size="18">Dati Todo</text>
    <text x="774" y="415" text-anchor="middle" font-size="15" fill="#52647a">Un database · proprietà distinta</text>
    <text x="520" y="500" text-anchor="middle" font-size="20" font-weight="700">Separare le responsabilità non richiede separare i processi.</text>
    <text x="520" y="527" text-anchor="middle" font-size="16" fill="#52647a">In entrambi i casi: una sola applicazione da distribuire.</text>
  </g>
