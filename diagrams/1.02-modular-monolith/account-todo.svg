<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc">
  <title id="title">Account e Todo: contratti e proprietà dei dati</title>
  <desc id="desc">Un deployment contiene Account e Todo. Todo chiama AccountApi.exists nello stesso processo. Account possiede account.users. Todo possiede todo.items e todo.user_state, oltre alla regola di massimo tre todo attivi e alla transazione che la protegge.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52647a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="710" rx="20" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
    <text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">1.2 / ESEMPIO</text>
    <text x="36" y="85" font-size="30" font-weight="700">La regola vive dove cambiano i todo</text>
    <rect x="28" y="115" width="984" height="335" rx="16" fill="#fff" stroke="#bbc9d8" stroke-dasharray="7 5"/>
    <text x="52" y="148" font-size="17" font-weight="700" fill="#52647a">UNA SOLA APPLICAZIONE / UN DEPLOYMENT</text>
    <rect x="52" y="172" width="350" height="252" rx="12" fill="#eaf0fa" stroke="#a9bddc"/>
    <text x="76" y="208" font-size="23" font-weight="700">Account</text>
    <rect x="76" y="230" width="302" height="64" rx="8" fill="#fff" stroke="#a9bddc"/>
    <text x="92" y="255" font-size="14" fill="#355b91">INTERFACCIA PUBBLICA</text>
    <text x="92" y="280" font-size="19" font-weight="700">AccountApi.exists(userId)</text>
    <text x="76" y="334" font-size="18">Dati e identità dell'utente</text>
    <text x="76" y="365" font-size="18">Repository e migrazioni privati</text>
    <rect x="638" y="172" width="350" height="252" rx="12" fill="#e8f5f1" stroke="#91c9bd"/>
    <text x="662" y="208" font-size="23" font-weight="700">Todo</text>
    <text x="662" y="251" font-size="14" fill="#14766d">INTERFACCIA PUBBLICA</text>
    <text x="662" y="280" font-size="19" font-weight="700">create · complete · reopen</text>
    <rect x="662" y="306" width="302" height="96" rx="8" fill="#fff" stroke="#91c9bd"/>
    <text x="680" y="337" font-size="20" font-weight="700" fill="#14766d">Massimo 3 todo attivi</text>
    <text x="680" y="363" font-size="16">Regola e transazione</text>
    <text x="680" y="386" font-size="16">protette dentro il modulo</text>
    <path d="M638 265 H410" stroke="#52647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="520" y="220" text-anchor="middle" font-size="16" fill="#52647a">Chiamata locale</text>
    <text x="520" y="243" text-anchor="middle" font-size="16" fill="#52647a">al contratto Account</text>
    <rect x="28" y="512" width="984" height="150" rx="16" fill="#fff" stroke="#bbc9d8"/>
    <text x="520" y="543" text-anchor="middle" font-size="17" font-weight="700" fill="#52647a">UN SOLO POSTGRESQL</text>
    <rect x="52" y="561" width="350" height="76" rx="8" fill="#eaf0fa"/>
    <rect x="638" y="561" width="350" height="76" rx="8" fill="#e8f5f1"/>
    <text x="227" y="606" text-anchor="middle" font-size="20">account.users</text>
    <text x="813" y="592" text-anchor="middle" font-size="19">todo.items</text>
    <text x="813" y="620" text-anchor="middle" font-size="19">todo.user_state</text>
    <g fill="none" stroke="#52647a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M227 424 V554"/>
      <path d="M813 424 V554"/>
    </g>
    <rect x="249" y="466" width="157" height="24" fill="#f6f8fb"/>
    <text x="253" y="483" font-size="16" fill="#52647a">Dati di Account</text>
    <rect x="827" y="466" width="161" height="24" fill="#f6f8fb"/>
    <text x="833" y="483" font-size="16" fill="#52647a">Dati di Todo</text>
    <text x="520" y="692" text-anchor="middle" font-size="17" fill="#52647a">Nessun accesso diretto alle tabelle dell'altro modulo.</text>
  </g>
</svg>
