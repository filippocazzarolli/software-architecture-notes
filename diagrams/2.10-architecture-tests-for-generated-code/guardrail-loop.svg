<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Le regole chiudono il ciclo</title>
  <desc id="desc">A sinistra un ciclo in quattro passi: l'agente modifica, esegue i controlli (lint, regole architetturali, test), legge il fallimento e corregge, ripete fino a quando i controlli passano; dal passo finale parte una freccia verso la pull request con le evidenze. A destra una fascia laterale con i file protetti: regole di dependency-cruiser, baseline delle violazioni, package.json, migrazioni; bloccati da un hook nell'ambiente dell'agente e da CODEOWNERS e CI nel repository. Una fascia in basso elenca cosa la revisione umana legge: superficie pubblica, dipendenze, migrazioni, versioni dei prompt, test rimossi, evidenze.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52647a" stroke-width="1.5"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="560" rx="20" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
    <text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">2.10 / GUARDRAIL</text>
    <text x="36" y="85" font-size="30" font-weight="700">Le regole chiudono il ciclo</text>
    <text x="36" y="116" font-size="18" fill="#52647a">I file che definiscono le regole stanno fuori dal ciclo dell'agente.</text>

    <!-- Ciclo -->
    <rect x="32" y="146" width="620" height="280" rx="12" fill="#fff" stroke="#bbc9d8"/>
    <text x="52" y="176" font-size="14" font-weight="700" fill="#52647a">IL CICLO DELL'AGENTE</text>

    <rect x="52" y="200" width="150" height="44" rx="8" fill="#fff4e6" stroke="#dcbf92"/>
    <text x="127" y="227" font-size="15" text-anchor="middle" font-weight="700">Modifica</text>
    <path d="M202 222 L242 222" fill="none" stroke="#52647a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="246" y="200" width="190" height="44" rx="8" fill="#eaf0fa" stroke="#a9bddc"/>
    <text x="341" y="220" font-size="15" text-anchor="middle" font-weight="700">Controlli</text>
    <text x="341" y="237" font-size="12" text-anchor="middle" fill="#52647a">lint · depcruise · test</text>
    <path d="M436 222 L476 222" fill="none" stroke="#14766d" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <rect x="480" y="200" width="150" height="44" rx="8" fill="#e3f3f1" stroke="#14766d"/>
    <text x="555" y="220" font-size="15" text-anchor="middle" font-weight="700" fill="#14766d">Pull request</text>
    <text x="555" y="237" font-size="12" text-anchor="middle" fill="#14766d">con le evidenze</text>

    <!-- loop back -->
    <path d="M341 244 L341 284 L127 284 L127 248" fill="none" stroke="#52647a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="234" y="302" font-size="12" text-anchor="middle" fill="#52647a">fallisce → correggi, entro il limite di tentativi</text>

    <text x="52" y="340" font-size="15" fill="#52647a">«Finito» lo dice il controllo, non l'agente</text>
    <text x="52" y="364" font-size="15" fill="#52647a">Il riscontro arriva al tentativo, non in revisione</text>
    <text x="52" y="388" font-size="15" fill="#52647a">La CI ripete gli stessi controlli come garanzia</text>
    <text x="52" y="412" font-size="14" font-weight="700" fill="#355b91">La baseline può solo accorciarsi: la CI fallisce se cresce</text>

    <!-- File protetti -->
    <rect x="684" y="146" width="324" height="280" rx="12" fill="#fff4e6" stroke="#dcbf92"/>
    <text x="704" y="176" font-size="14" font-weight="700" fill="#b07a2a">FUORI DAL CICLO</text>
    <text x="704" y="206" font-size="21" font-weight="700">File protetti</text>
    <text x="704" y="238" font-size="14" font-family="Menlo, Consolas, monospace" fill="#52647a">.dependency-cruiser.cjs</text>
    <text x="704" y="258" font-size="14" font-family="Menlo, Consolas, monospace" fill="#52647a">…-known-violations.json</text>
    <text x="704" y="278" font-size="14" font-family="Menlo, Consolas, monospace" fill="#52647a">package.json</text>
    <text x="704" y="298" font-size="14" font-family="Menlo, Consolas, monospace" fill="#52647a">migrations/</text>
    <text x="704" y="334" font-size="15" fill="#52647a">Nell'ambiente dell'agente: un hook</text>
    <text x="704" y="356" font-size="15" fill="#52647a">Nel repository: CODEOWNERS e CI</text>
    <text x="704" y="388" font-size="14" font-weight="700" fill="#b07a2a">Cambiano in una PR di una persona,</text>
    <text x="704" y="408" font-size="14" font-weight="700" fill="#b07a2a">con la motivazione registrata</text>

    <!-- Fascia inferiore -->
    <rect x="32" y="446" width="976" height="84" rx="12" fill="#fff" stroke="#bbc9d8" stroke-dasharray="6 4"/>
    <text x="52" y="473" font-size="15" font-weight="700">Cosa legge la revisione umana</text>
    <text x="52" y="497" font-size="15" fill="#52647a">Diff dei file public.ts · dipendenze e migrazioni arrivate in PR separate · versioni dei prompt con il rapporto degli eval</text>
    <text x="52" y="519" font-size="15" fill="#52647a">Test rimossi o indeboliti · le evidenze dell'agente: comandi eseguiti e output · non le millequattrocento righe</text>
  </g>
</svg>
