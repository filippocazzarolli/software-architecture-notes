<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Tre errori, tre confini</title>
  <desc id="desc">Tre riquadri da sinistra a destra: il parser nell'adapter, che trasforma una risposta non JSON o di forma inattesa in un errore tecnico, scarta i titoli vuoti o troppo lunghi e ignora i campi sconosciuti; il caso d'uso, che tronca e deduplica, prende il proprietario dalla sessione e decide lo stato; il dominio, che costruisce il titolo come value object e applica il limite dei tre attivi nella transazione. Una fascia in basso ricorda che il modello non ha strumenti né permessi.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52647a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="520" rx="20" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
    <text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">2.3 / OUTPUT DEL MODELLO</text>
    <text x="36" y="85" font-size="30" font-weight="700">Tre errori, tre confini</text>
    <text x="36" y="116" font-size="18" fill="#52647a">La risposta del modello attraversa gli stessi controlli di una richiesta HTTP.</text>

    <rect x="32" y="146" width="300" height="190" rx="12" fill="#fff4e6" stroke="#dcbf92"/>
    <rect x="370" y="146" width="300" height="190" rx="12" fill="#fff" stroke="#bbc9d8"/>
    <rect x="708" y="146" width="300" height="190" rx="12" fill="#eaf0fa" stroke="#a9bddc"/>

    <text x="52" y="176" font-size="14" font-weight="700" fill="#b07a2a">FORMA</text>
    <text x="52" y="206" font-size="21" font-weight="700">Parser nell'adapter</text>
    <text x="52" y="240" font-size="15" fill="#52647a">Forma inattesa → errore tecnico</text>
    <text x="52" y="262" font-size="15" fill="#52647a">Titoli vuoti o troppo lunghi scartati</text>
    <text x="52" y="284" font-size="15" fill="#52647a">Campi sconosciuti ignorati</text>

    <text x="390" y="176" font-size="14" font-weight="700" fill="#52647a">MANDATO</text>
    <text x="390" y="206" font-size="21" font-weight="700">Caso d'uso</text>
    <text x="390" y="240" font-size="15" fill="#52647a">Troncamento e deduplicazione</text>
    <text x="390" y="262" font-size="15" fill="#52647a">Proprietario dalla sessione</text>
    <text x="390" y="284" font-size="15" fill="#52647a">Stato deciso qui, non dal modello</text>

    <text x="728" y="176" font-size="14" font-weight="700" fill="#355b91">REGOLE</text>
    <text x="728" y="206" font-size="21" font-weight="700">Dominio</text>
    <text x="728" y="240" font-size="15" fill="#52647a">Titolo come value object</text>
    <text x="728" y="262" font-size="15" fill="#52647a">Limite dei tre attivi in transazione</text>
    <text x="728" y="284" font-size="15" fill="#52647a">TodoLimitExceeded → 409</text>

    <path d="M332 241 L366 241" fill="none" stroke="#52647a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M670 241 L704 241" fill="none" stroke="#52647a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="520" y="362" font-size="14" text-anchor="middle" fill="#14766d">Nessun percorso privilegiato: la conferma entra dallo stesso controller della creazione manuale.</text>

    <rect x="32" y="384" width="976" height="66" rx="12" fill="#fff" stroke="#bbc9d8" stroke-dasharray="6 4"/>
    <text x="52" y="411" font-size="15" font-weight="700">Autorità</text>
    <text x="52" y="434" font-size="15" fill="#52647a">Il modello non ha strumenti né permessi. Una prompt injection produce al più un titolo sbagliato, che l'utente non conferma.</text>

    <text x="36" y="496" font-size="15" fill="#52647a">Il sistema accetta dal modello solo ciò che accetterebbe da un utente che digita.</text>
  </g>
</svg>
