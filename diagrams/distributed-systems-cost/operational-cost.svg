<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">Separare il deployment cambia il lavoro</title><desc id="desc">Da Account e Todo nello stesso processo a servizi con archivi propri: tra le opzioni ci sono costi di comunicazione, rilascio e recupero da valutare.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#14766d" stroke-width="1.5"/></marker></defs><rect width="1040" height="520" rx="20" fill="#f6f8fb"/><g font-family="Arial, Helvetica, sans-serif" fill="#182b43">
<text x="36" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#52647a">10 / COSTO OPERATIVO</text><text x="36" y="88" font-size="29" font-weight="700">Separare il deployment cambia il lavoro</text>
<rect x="36" y="145" width="300" height="270" rx="14" fill="#eaf0fa" stroke="#a9bddc"/><text x="56" y="186" font-size="21" font-weight="700">Nucleo modulare</text>
<text x="56" y="233" font-size="17" fill="#52647a">Account + Todo</text>
<text x="56" y="264" font-size="17" fill="#52647a">Un artefatto distribuibile</text>
<text x="56" y="295" font-size="17" fill="#52647a">Chiamate locali</text>
<text x="56" y="326" font-size="17" fill="#52647a">PostgreSQL condiviso</text>
<path d="M339 282 H361" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="370" y="145" width="300" height="270" rx="14" fill="#e8f5f1" stroke="#91c9bd"/><text x="390" y="186" font-size="21" font-weight="700">Costi da valutare</text>
<text x="390" y="233" font-size="17" fill="#52647a">Rete e timeout</text>
<text x="390" y="264" font-size="17" fill="#52647a">Contratti compatibili</text>
<text x="390" y="295" font-size="17" fill="#52647a">Log e tracce correlati</text>
<text x="390" y="326" font-size="17" fill="#52647a">Recupero e responsabilità</text>
<path d="M673 282 H695" fill="none" stroke="#14766d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="704" y="145" width="300" height="270" rx="14" fill="#fff4e6" stroke="#dcbf92"/><text x="724" y="186" font-size="21" font-weight="700">Servizi indipendenti</text>
<text x="724" y="233" font-size="17" fill="#52647a">Account → archivio proprio</text>
<text x="724" y="264" font-size="17" fill="#52647a">Todo → archivio proprio</text>
<text x="724" y="295" font-size="17" fill="#52647a">Capacità e rilasci separati</text>
<text x="724" y="326" font-size="17" fill="#52647a">Isolamento da progettare</text>
<text x="520" y="462" text-anchor="middle" font-size="18" fill="#52647a">Report asincrono può essere isolato senza rallentare il completamento dei todo.</text>
<text x="520" y="490" text-anchor="middle" font-size="16" fill="#52647a">Valutiamo ogni estrazione sul problema concreto che dovrebbe risolvere.</text>
</g></svg>
